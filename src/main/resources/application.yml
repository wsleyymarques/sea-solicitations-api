spring:
  application:
    name: solicitations-api

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:solicitations}
    username: ${POSTGRES_USER:solicitations}
    password: ${POSTGRES_PASSWORD:}

  elasticsearch:
    uris: http://localhost:${ELASTICSEARCH_PORT:9200}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    issuer: ${JWT_ISSUER:sea-solicitations-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    secret: ${JWT_SECRET:}

integrations:
  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br}
    connect-timeout: ${VIACEP_CONNECT_TIMEOUT:2s}
    read-timeout: ${VIACEP_READ_TIMEOUT:3s}
